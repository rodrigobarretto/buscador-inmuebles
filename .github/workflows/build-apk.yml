name: Compilar APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar carpeta android (si no está en el repo)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.zovrana --project-name buscador_inmuebles .
          fi

      - name: Permisos de Internet y apertura de links
        run: python3 tool/parchear_manifest.py android/app/src/main/AndroidManifest.xml

      - name: Firma fija (para poder actualizar la app sin desinstalar)
        run: |
          mkdir -p ~/.android
          cp firma/debug.keystore ~/.android/debug.keystore

      - name: Compilar
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64 --dart-define=REPO=${{ github.repository }} --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk ../buscador-inmuebles.apk

      - uses: actions/upload-artifact@v4
        with:
          name: buscador-inmuebles-apk
          path: buscador-inmuebles.apk

      - name: Publicar en Releases (descarga directa desde el celu)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Última APK (build ${{ github.run_number }})"
          body: "Compilada automáticamente desde ${{ github.sha }}"
          files: buscador-inmuebles.apk
          make_latest: true
