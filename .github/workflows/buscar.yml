name: Buscar oportunidades

on:
  schedule:
    # 10:37 UTC = 07:37 hora Argentina, todos los días
    - cron: "37 10 * * *"
  workflow_dispatch: {}   # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: buscar
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt

      - name: Prueba rápida de los parsers
        run: python scraper/test_offline.py

      - name: Buscar
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scraper/main.py

      - name: Guardar resultados en el repo
        run: |
          git config user.name  "buscador-bot"
          git config user.email "buscador-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Oportunidades $(TZ=America/Argentina/Buenos_Aires date +'%Y-%m-%d %H:%M')"
            git pull --rebase --autostash
            git push
          fi
